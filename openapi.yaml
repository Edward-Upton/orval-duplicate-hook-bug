openapi: 3.0.3
info:
  title: Paginated API
  description: API with cursor-based pagination
  version: 1.0.0

paths:
  /items:
    get:
      operationId: getItem
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"

components:
  schemas:
    IDFields:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the item

    Item:
      type: object
      required:
        - id
      allOf:
        - $ref: "#/components/schemas/IDFields"
